<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="maroonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#481216"/>
      <stop offset="100%" stop-color="#2D0B0E"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Maroon Shield Base -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#maroonBg)" stroke="url(#goldGradient)" stroke-width="12"/>
  
  <!-- Inner Gold Hairline Inset -->
  <rect x="42" y="42" width="428" height="428" rx="82" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Legal Scales of Justice & Monogram -->
  <g filter="url(#goldGlow)" fill="url(#goldGradient)" stroke="url(#goldGradient)">
    <!-- Top Finial -->
    <circle cx="256" cy="116" r="18" stroke-width="0"/>
    <path d="M256 86 L262 104 L250 104 Z" stroke-width="0"/>

    <!-- Central Pillar / Sword -->
    <rect x="250" y="130" width="12" height="240" rx="3" stroke-width="0"/>
    
    <!-- Balance Beam -->
    <path d="M124 186 C180 178 332 178 388 186 C388 196 124 196 124 186 Z" stroke-width="0"/>
    
    <!-- Left Scale Pan Assembly -->
    <line x1="130" y1="192" x2="94" y2="280" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="130" y1="192" x2="166" y2="280" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M82 280 Q130 318 178 280 Z" stroke-width="0"/>
    
    <!-- Right Scale Pan Assembly -->
    <line x1="382" y1="192" x2="346" y2="280" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="382" y1="192" x2="418" y2="280" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M334 280 Q382 318 430 280 Z" stroke-width="0"/>

    <!-- Solid Pedestal Base -->
    <path d="M196 370 H316 L332 400 H180 Z" stroke-width="0"/>
    <rect x="160" y="400" width="192" height="12" rx="3" stroke-width="0"/>
  </g>

  <!-- RK Monogram Typography -->
  <text x="256" y="452" font-family="'Times New Roman', Times, serif" font-size="38" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="10">RK</text>
</svg>
